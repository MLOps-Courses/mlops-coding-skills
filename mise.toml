# https://mise.jdx.dev
# Canonical task vocabulary shared by git hooks (lefthook) and CI (GitHub Actions).

[settings.task]
# Tasks must fail loudly on a missing tool rather than silently installing one mid-run:
# `mise install` is the explicit step, so hooks and CI never race an unpinned download.
run_auto_install = false

[tools]
actionlint = "latest"
dprint = "latest"
gh = "latest"
git-cliff = "latest"
gitleaks = "latest"
lefthook = "latest"
trivy = "latest"
zizmor = "latest"

# ALL

[tasks.all]
alias = "a"
description = "Format and check the repository (the canonical gate)"
# There is no application code here, so the gate stops at format + check: no test, no build.
run = ["mise run format", "mise run check"]

# INSTALL

[tasks.install]
alias = "i"
description = "Install git hooks (lefthook)"
depends = ["install:hooks"]

[tasks."install:hooks"]
description = "Install git hooks (lefthook)"
run = "lefthook install"

# FORMAT

[tasks.format]
alias = "f"
description = "Format all documents and configuration"
run = ["mise run format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, YAML (dprint)"
run = "dprint fmt"

# CHECK

[tasks.check]
alias = "c"
description = "Run all static checks in parallel"
depends = [
  "check:actions",
  "check:format",
  "check:frontmatter",
  "check:leaks",
  "check:scan",
  "check:skills",
]

[tasks."check:actions"]
description = "Lint and audit GitHub Actions workflows (actionlint + zizmor)"
run = ["actionlint", "zizmor --offline .github/workflows/"]

[tasks."check:format"]
description = "Check formatting of JSON, Markdown, TOML, YAML (dprint)"
run = "dprint check"

[tasks."check:leaks"]
description = "Audit recent commits for leaked secrets (gitleaks)"
# Only the newest commits, so hooks and push CI stay fast on a growing history. The
# full-history pass lives in `.github/workflows/security.yml`, on a weekly schedule.
run = 'gitleaks git --log-opts="--max-count=100" --verbose'

[tasks."check:scan"]
description = "Scan the checkout for misconfigurations, secrets, and licenses (trivy)"
# `--config` is explicit on purpose: without it a `TRIVY_CONFIG` exported in the user's
# shell silently wins over the policy committed here, and the repository's own rules
# never run. `fs` (not `config`) is what actually enables every scanner in trivy.yaml.
run = "trivy --config trivy.yaml fs ."

[tasks."check:skills"]
description = "Validate every skill against the Agent Skills specification (gh skill)"
# The publishing gate itself, run without publishing: it rejects an invalid skill name, a
# name that disagrees with its folder, missing required frontmatter, and install metadata
# leaked into a committed SKILL.md. A missing `license` is only a warning, so this task
# cannot replace `check:frontmatter` — it complements it.
run = "gh skill publish --dry-run ."

[tasks."check:frontmatter"]
description = "Assert each SKILL.md frontmatter name is slug-cased and matches its folder"
# The offline floor: no network, no `gh`, no GitHub account, and it names the exact file.
run = """
status=0
for dir in mlops-*/; do
  folder=${dir%/}
  skill="$folder/SKILL.md"
  if [ ! -f "$skill" ]; then
    echo "MISSING: $skill"
    status=1
    continue
  fi
  # Read the frontmatter `name:` value (first match), trimming surrounding whitespace.
  name=$(awk -F':[[:space:]]*' '/^name:/ {print $2; exit}' "$skill" | sed 's/[[:space:]]*$//')
  if ! printf '%s' "$name" | grep -Eq '^[a-z0-9-]+$'; then
    echo "INVALID: '$name' in $skill must match ^[a-z0-9-]+\\$"
    status=1
  elif [ "$name" != "$folder" ]; then
    echo "MISMATCH: name '$name' != folder '$folder' in $skill"
    status=1
  else
    echo "OK: $folder"
  fi
done
exit $status
"""
